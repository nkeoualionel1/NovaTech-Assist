services:
  db:
    image: pgvector/pgvector:pg17
    container_name: novatech-db
    environment:
      POSTGRES_USER: novatech
      POSTGRES_PASSWORD: novatech
      POSTGRES_DB: novatech
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novatech"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
